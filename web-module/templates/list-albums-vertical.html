<div class="flex w-full snap-x snap-mandatory gap-4 overflow-x-auto p-2 pb-4">
  @for (album in albums) {
    @defer (album-card.html; album=album) {}
  }
  @if (more) {
    <button
      class="btn btn-secondary shrink-0 self-center"
      hx-get="{{ more }}"
      hx-swap="outerHTML"
    >
      More
    </button>
  }
</div>
